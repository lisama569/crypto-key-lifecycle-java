# 密钥生命周期管理配置（全部为本地内存实现，不依赖任何外部服务）
spring.application.name=crypto-key-lifecycle-java

# AES 密钥位长度（128/192/256）
keylifecycle.key-size-bits=256
# AES/GCM 参数：12 字节随机 IV，128 bit 认证标签
keylifecycle.gcm-iv-length-bytes=12
keylifecycle.gcm-tag-length-bits=128
# 历史数据迁移默认每批处理记录数
keylifecycle.migration-batch-size=100
# 启动时自动生成并启用第一个密钥版本
keylifecycle.bootstrap-key-on-startup=true

# 单测日志中打印密钥版本、操作类型与判定依据（KEY_LIFECYCLE_AUDIT logger）
logging.level.KEY_LIFECYCLE_AUDIT=INFO
logging.pattern.level=%5p
