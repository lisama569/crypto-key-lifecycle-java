# ===== 本地密钥生命周期配置 =====
# AES 密钥位宽：仅允许 128 / 192 / 256
keylifecycle.aes-key-bits=256
# GCM 随机 IV 长度（字节），推荐 12
keylifecycle.gcm-iv-bytes=12
# GCM 认证标签长度（位），推荐 128
keylifecycle.gcm-tag-bits=128
# 历史数据迁移默认单批条数（REST 层未显式传 limit 时由调用方控制）
keylifecycle.migration-batch-size=100

# 日志：打印密钥版本、操作类型与判定依据
logging.level.com.github.lisama569.cryptokeylifecyclejava=INFO
